name: "I'm building this / 我在造这个"
description: "Tell everyone you're building an X-WOW invention. Checked posts appear on the builders' wall. / 告诉大家你在造哪个发明，核对后会出现在建造者墙上。"
title: "[Building] "
labels: ["building"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building! This post is **public**. Please don't include personal details (address, phone, email).
        谢谢你来造！这个帖子是**公开**的，请不要写地址、电话、邮箱等个人信息。
  - type: dropdown
    id: invention
    attributes:
      label: "Which invention? / 哪个发明？"
      options:
        - "SWELL: expansion microscope / 膨胀显微镜"
        - "SWELL: £5 laser-diffraction experiment / £5 激光衍射小实验"
        - "Back to Shine / 旧仪器再发光"
        - "Something else / 其他"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: "Where, roughly? (country or city is plenty) / 大概在哪？（国家或城市就够了）"
      placeholder: "e.g. Lagos, Nigeria"
  - type: textarea
    id: plan
    attributes:
      label: "What are you building, and how far along are you? / 你在造什么，进展到哪一步了？"
      description: "Photos, results, failures and changes are all welcome. Failures help the next person most. / 照片、结果、失败、改动都欢迎，失败经验对下一个人最有用。"
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: "Anything you need help with? / 需要什么帮助吗？"
  - type: checkboxes
    id: wall
    attributes:
      label: "Builders' wall / 建造者墙"
      options:
        - label: "You may show this post on the x-wow.com builders' wall. / 可以把这个帖子展示在 x-wow.com 的建造者墙上。"
        - label: "I've read the safety notes for this invention, and I'll do any chemical work only in a proper lab. / 我已经读过这个发明的安全说明，化学操作只在正规实验室里做。"
          required: true
